# Qwen3.5-0.8B: the recipe behind ResuVL-L (weight average of 3 seeds, 0.858 / 0.822 lenient F1 on the dev pages).
# The InternVL3-1B recipe unchanged, with a different base. Needs transformers >= 5.2; on GPU also
# flash-linear-attention and causal-conv1d (about 7x faster training; see docs/training.md).
# python -m tiny_resume_parser.train --config configs/qwen3.5-0.8b.toml --seed 42 --out runs/NAME
model = "Qwen/Qwen3.5-0.8B"
augment = 0.5           # image noise on half of the training pages
lr = 1e-5
epochs = 6
max_patches = 12        # page area cap in 448 x 448 px units (one image token per 32 x 32 px); score with the same value
no_grad_ckpt = true
save_every_epoch = true # the epoch is chosen on the validation pages afterwards
workers = 8
