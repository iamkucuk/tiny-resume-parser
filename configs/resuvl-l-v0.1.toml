# ResuVL-L v0.1 (0.94B): the training recipe; the released model averaged the weights of 10 seeds (0.732 / 0.724
# lenient F1). ResuVL-L uses the same settings.
# python -m tiny_resume_parser.train --config configs/resuvl-l-v0.1.toml --seed 42 --out runs/NAME
model = "OpenGVLab/InternVL3-1B-hf"
augment = 0.5           # image noise on half of the training pages
lr = 1e-5
epochs = 6
max_patches = 12        # 448 px tiles per page (+1 thumbnail); score with the same value
no_grad_ckpt = true
save_every_epoch = true # the epoch is chosen on the validation pages afterwards
workers = 8
