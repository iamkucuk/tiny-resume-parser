# ResuVL-S (0.26B): the training recipe; the released model averages the weights of 4 seeds (0.660 / 0.649 lenient F1).
# python -m tiny_resume_parser.train --config configs/resuvl-s.toml --seed 42 --out runs/NAME
model = "ibm-granite/granite-docling-258M"
augment = 0.5
lr = 1e-4               # +0.024 / +0.031 over 6e-5 (2-seed means)
epochs = 10
max_patches = 12        # longest edge 2048 px; 30 and 48 tiles scored lower
no_grad_ckpt = true
save_every_epoch = true
workers = 8
